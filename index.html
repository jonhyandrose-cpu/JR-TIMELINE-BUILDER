const API='https://eiivhnfalyhoyujwpzzq.supabase.co/rest/v1/wedding_timelines',KEY='sb_publishable_Wr4xUrtN3XRhozHW-pwGPA_y3XlNECV',STUDIO='jr-timeline-studio-2026-8f3a';
const fields=['couple_name','wedding_date','location','coverage','guests','coordinator','videographer','ceremony','cocktail','reception','wedding_party'];const labels={couple_name:'Couple',wedding_date:'Wedding Date',location:'Location / Venue',coverage:'Photography Coverage',guests:'Estimated Guests',coordinator:'Coordinator',videographer:'Videographer',ceremony:'Ceremony',cocktail:'Cocktail Hour',reception:'Reception',wedding_party:'Wedding Party'};let state={id:null,public_slug:null,timeline:[],key_requests:[]},all=[];
function headers(){return{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json','x-client-info':STUDIO}}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function parseDate(s){let d=new Date(String(s||'').replace(/(\d+)(st|nd|rd|th)/i,'$1'));return isNaN(d)?null:d}function niceDate(s){let d=parseDate(s);return d?d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):s||'Date TBD'}function monthKey(s){let d=parseDate(s);return d?d.toLocaleDateString('en-US',{month:'long',year:'numeric'}):'Date TBD'}

async function dashboard(){document.getElementById('app').innerHTML=chrome('<button class="primary" onclick="newTimeline()">+ NEW TIMELINE</button>')+'<div class="shell"><div class="hero"><div><div class="eyebrow">Wedding Workspace</div><h1>All timelines.</h1><p>One place for every wedding. Open, update and share the same living timeline with your couples.</p></div><div class="muted" id="count">Loading weddings…</div></div><div id="dash"><div class="empty">Loading timelines…</div></div></div>';let r=await fetch(API+'?select=*&order=wedding_date.asc',{headers:headers()});all=await r.json();document.getElementById('count').textContent=all.length+' saved timeline'+(all.length===1?'':'s');let groups={};all.forEach(x=>(groups[monthKey(x.wedding_date)]??=[]).push(x));let html='';Object.keys(groups).forEach(m=>{html+='<section class="month"><div class="monthHead"><h2>'+esc(m)+'</h2></div>'+groups[m].map(x=>'<div class="wedding"><div class="datebox">'+esc(niceDate(x.wedding_date).split(',')[0])+'<small>'+esc(x.coverage||'Coverage TBD')+'</small></div><div class="couple">'+esc(x.couple_name||'Untitled Wedding')+'</div><div class="venue">'+esc(x.location||'Location TBD')+'</div><div class="updated">Updated<br>'+esc(new Date(x.updated_at).toLocaleDateString())+'</div><div class="actions"><button onclick="openTimeline(\''+x.id+'\')">Open</button><button onclick="clientLink(\''+esc(x.public_slug)+'\')">Client Link</button></div></div>').join('')+'</section>'});document.getElementById('dash').innerHTML=html||'<div class="empty">No timelines yet. Create your first one.</div>'}
function newTimeline(){state={id:null,public_slug:null,timeline:[],key_requests:[]};editor()}function openTimeline(id){state=JSON.parse(JSON.stringify(all.find(x=>x.id===id)));editor()}function editor(){document.getElementById('app').innerHTML=chrome('<div class="toolbar"><button onclick="dashboard()">Dashboard</button><button class="primary" onclick="save()">Save Online</button><button onclick="publish()">Publish Timeline</button></div>')+'<div class="editor"><div class="editorTop"><div><div class="eyebrow">Timeline Editor</div><div class="muted">Edit freely. Your client link stays current.</div></div><button onclick="newTimeline()">New</button></div><div class="editorBody"><h1>'+esc(state.couple_name||'New Wedding Timeline')+'</h1><div class="muted">'+esc(state.wedding_date||'Wedding date')+'</div><h3 class="sectionTitle">Essential Information</h3><div class="grid" id="fields"></div><h3 class="sectionTitle">Key Photo Requests</h3><textarea id="requests" rows="4" placeholder="One request per line"></textarea><h3 class="sectionTitle">Wedding Day Timeline</h3><div id="rows"></div><button onclick="addRow()">+ Add timeline item</button><div class="importBox"><div class="eyebrow">Smart Questionnaire Import</div><h3>Turn the questionnaire into a draft.</h3><input type="file" id="pdf" accept="application/pdf" onchange="JRReadPdf(event)"><textarea id="importText" rows="6" placeholder="Extracted questionnaire text appears here. You can also paste text manually."></textarea><div class="toolbar"><button class="primary" onclick="generateDraft()">Generate timeline draft</button></div><div class="status" id="importStatus"></div></div><div class="status" id="status">'+(state.updated_at?'UPDATED: '+new Date(state.updated_at).toLocaleString():'UPDATED: Not saved yet')+'</div></div></div>';renderEditor()}
function renderEditor(){document.getElementById('fields').innerHTML=fields.map(n=>'<div class="field"><label>'+labels[n]+'</label><input id="f_'+n+'" value="'+esc(state[n])+'"></div>').join('');document.getElementById('requests').value=(state.key_requests||[]).join('\n');document.getElementById('rows').innerHTML=(state.timeline||[]).map((r,i)=>'<div class="timelineRow"><input value="'+esc(r.time)+'" onchange="state.timeline['+i+'].time=this.value"><input value="'+esc(r.item)+'" onchange="state.timeline['+i+'].item=this.value"><div class="move"><button title="Move up" onclick="moveRow('+i+',-1)">↑</button><button title="Move down" onclick="moveRow('+i+',1)">↓</button><button title="Delete" onclick="state.timeline.splice('+i+',1);renderEditor()">×</button></div></div>').join('')}

async function save(){sync();let body={};fields.forEach(n=>body[n]=state[n]||'');body.key_requests=state.key_requests;body.timeline=state.timeline;let url=API,method='POST';if(state.id){url+='?id=eq.'+state.id;method='PATCH'}let r=await fetch(url,{method,headers:{...headers(),Prefer:'return=representation'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok){alert('Save error: '+(d.message||JSON.stringify(d)));return}state={...state,...d[0]};document.getElementById('status').textContent='UPDATED: '+new Date(state.updated_at).toLocaleString();alert('Saved online ✓')}

async function readPdf(e){let f=e.target.files[0];if(!f)return;let st=document.getElementById('importStatus');st.textContent='Reading '+f.name+'…';try{if(!window.pdfjsLib)throw Error('PDF reader unavailable');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';let doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,p=[];for(let n=1;n<=doc.numPages;n++){let pg=await doc.getPage(n),tc=await pg.getTextContent();p.push(tc.items.map(i=>i.str).join(' '))}document.getElementById('importText').value=p.join('\n');st.textContent='PDF read successfully. Click Generate timeline draft.'}catch(err){st.textContent='Could not read automatically. Paste the questionnaire text below.'}}
function findVal(t,patterns){for(let re of patterns){let m=t.match(re);if(m&&m[1])return m[1].trim().replace(/\s{2,}/g,' ')}return''}function generateDraft(){let t=document.getElementById('importText').value;if(!t.trim()){alert('Upload a PDF or paste questionnaire text first.');return}let one=t.replace(/\r/g,' ').replace(/[ \t]+/g,' ');let vals={couple_name:findVal(one,[/(?:couple names?|bride\s*(?:name)?\s*(?:&|and)\s*groom\s*(?:name)?|names?)\s*[:\-]\s*([^\n]{3,80})/i,/(?:Bride[^:\n]*:)\s*([^\n]{2,45}).{0,100}?(?:Groom[^:\n]*:)\s*([^\n]{2,45})/i]),wedding_date:findVal(one,[/(?:wedding date|event date|date of wedding)\s*[:\-]\s*([^\n]{4,45})/i]),location:findVal(one,[/(?:wedding location|venue|hotel|location)\s*[:\-]\s*([^\n]{3,130})/i]),coverage:findVal(one,[/(?:package contracted|contracted package|photography package|package|coverage)\s*[:\-]\s*([^\n]{2,100})/i]),guests:findVal(one,[/(?:number of guests|estimated guests|guests)\s*[:\-]\s*([0-9]{1,4})/i]),coordinator:findVal(one,[/(?:coordinator|wedding planner)\s*[:\-]\s*([^\n]{2,100})/i]),videographer:findVal(one,[/(?:videographer|videography)\s*[:\-]\s*([^\n]{2,100})/i]),ceremony:findVal(one,[/(?:ceremony(?: venue| location)?)\s*[:\-]\s*([^\n]{2,130})/i]),cocktail:findVal(one,[/(?:cocktail(?: hour)?(?: venue| location)?)\s*[:\-]\s*([^\n]{2,130})/i]),reception:findVal(one,[/(?:reception(?: venue| location)?)\s*[:\-]\s*([^\n]{2,130})/i]),wedding_party:findVal(one,[/(?:wedding party)\s*[:\-]\s*([^\n]{2,130})/i])};if(vals.couple_name&&vals.couple_name.includes('Bride'))vals.couple_name='';Object.keys(vals).forEach(k=>{if(vals[k])state[k]=vals[k]});if(!state.timeline.length)state.timeline=[{time:'',item:'Details Shots / Getting Ready Coverage Begins'},{time:'',item:'First Look / Couple Portraits'},{time:'',item:'Wedding Party Photos'},{time:'',item:'Family Photos'},{time:'',item:'Ceremony Prep'},{time:'',item:'Ceremony'},{time:'',item:'Cocktail Hour / Guest Candids'},{time:'',item:'Golden Hour Couple Photos'},{time:'',item:'Reception Begins'},{time:'',item:'Photography Service Ends'}];editor()}

  }
}
